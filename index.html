<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f9fafb;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(249,250,251,0.2);
      border-top-color: #f9fafb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.8; font-size: 14px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Redirecionando...</p>
    <p id="fallback" style="display:none;">
      Se não for redirecionado automaticamente, <a id="link" href="#">clique aqui</a>.
    </p>
  </div>

  <script>
    // Busca o destino.js direto do domínio "raw" do GitHub (cache mais curto
    // que o GitHub Pages), e o "?v=" com timestamp garante que a URL nunca
    // é igual à anterior, ignorando qualquer cache do navegador também
    var url = "https://raw.githubusercontent.com/gpalink/redirect/main/destino.js?v=" + Date.now();

    fetch(url, { cache: "no-store" })
      .then(function (res) { return res.text(); })
      .then(function (texto) {
        // Extrai o valor de DESTINO do conteúdo do arquivo, sem precisar executá-lo
        var match = texto.match(/DESTINO\s*=\s*["']([^"']+)["']/);
        var destino = match ? match[1] : null;

        if (destino) {
          document.getElementById("link").href = destino;
          window.location.replace(destino);
          setTimeout(function () {
            document.getElementById("fallback").style.display = "block";
          }, 1500);
        } else {
          document.body.innerHTML = "<p>Link de destino não configurado corretamente.</p>";
        }
      })
      .catch(function () {
        document.body.innerHTML = "<p>Não foi possível carregar o destino. Tente novamente em instantes.</p>";
      });
  </script>
</body>
</html>
