<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <script src="destino.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f9fafb;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(249,250,251,0.2);
      border-top-color: #f9fafb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.8; font-size: 14px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Redirecionando...</p>
    <p id="fallback" style="display:none;">
      Se não for redirecionado automaticamente, <a id="link" href="#">clique aqui</a>.
    </p>
  </div>

  <script>
    if (typeof DESTINO !== "undefined" && DESTINO) {
      document.getElementById("link").href = DESTINO;
      window.location.replace(DESTINO);
      // Mostra o link manual caso o redirecionamento automático falhe
      setTimeout(function () {
        document.getElementById("fallback").style.display = "block";
      }, 1500);
    } else {
      document.body.innerHTML = "<p>Link de destino não configurado.</p>";
    }
  </script>
</body>
</html>
